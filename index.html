<style>

  --bg:#12161c; --panel:#1a2028; --line:#2a323d; --text:#e7ebf0; --muted:#8b95a3;

*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
header{position:sticky;top:0;padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:5;}
header h1{font-size:17px;margin:0;}
main{max-width:820px;margin:0 auto;padding:20px 16px 60px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
h2{font-size:15px;margin:0 0 12px;color:var(--amber);}
input,button{font:inherit;}
input[type=text],input[type=password],input[type=email]{width:100%;padding:10px 12px;background:#0f1319;border:1px solid var(--line);
  border-radius:7px;color:var(--text);margin-bottom:10px;}
button{background:var(--amber);color:#1a1406;border:none;padding:9px 16px;border-radius:7px;font-weight:600;cursor:pointer;white-space:nowrap;}

.tab.active{background:var(--amber-dim);color:var(--amber);border-color:var(--amber-dim);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:500;}
.tablewrap{overflow-x:auto;}
.muted{color:var(--muted);font-size:13px;}
.hint{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:12px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:320px;width:100%;}
.err{color:#e07a7a;font-size:13px;margin:-4px 0 10px;min-height:16px;}
.uploadBlock{border-top:1px solid var(--line);padding-top:16px;margin-top:16px;}
.uploadBlock:first-of-type{border-top:none;padding-top:0;margin-top:0;}
.uploadBlock h3{font-size:14px;margin:0 0 8px;}
.itemCard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:#161b22;}
.itemCard h3{margin:0 0 8px;font-size:14px;}
.itemCard .itemNo{color:var(--muted);font-weight:400;font-size:12px;}
.snGroupLabel{font-size:12px;color:var(--muted);margin:10px 0 4px;}
.snList{display:flex;flex-wrap:wrap;gap:6px;}
.snChip{font-size:12px;background:#0f1319;border:1px solid var(--line);border-radius:6px;padding:4px 8px;}
.snChip.old{border-color:var(--warn);color:var(--warn);background:rgba(224,120,90,.1);font-weight:600;}
.indentBox{margin-top:10px;font-size:13px;background:rgba(224,168,64,.08);border:1px solid var(--amber-dim);border-radius:6px;padding:8px 10px;color:var(--amber);}
</style>

<script>

/* PIN yang diketik staff akan otomatis login memakai akun Firebase di bawah ini.
   Ganti PIN, email, dan password sesuai akun staff yang sudah kamu buat di Authentication. */

const OWN_WAREHOUSES = ["SDNC.UTM","SDNC.SHO","SDNC.DEM","SDNC.RUS"];
const CHUNK_SIZE = 4000; // baris per dokumen Firestore (aman di bawah batas 1MB/dokumen)

let state = {
  items: [], serialNumber: [], stockCabang: [], barcode: [],
  itemsUpdated: '', serialUpdated: '', cabangUpdated: '', barcodeUpdated: '',
  itemsIndex: {}, serialIndex: {}, cabangIndex: {}, barcodeIndex: {},
  staffMode: false, tab: 'upload', showLogin: false, loginErr: '',
  categoryFilter: null, query: '', loaded: false
};

// ---------------- Firestore helpers ----------------
async function pushToFirestore(collectionName, rows, metaKey){
  const chunks = [];
  for(let i=0;i<rows.length;i+=CHUNK_SIZE) chunks.push(rows.slice(i,i+CHUNK_SIZE));
  const metaRef = db.collection('meta').doc(metaKey);
  const metaSnap = await metaRef.get();
  const oldCount = metaSnap.exists ? (metaSnap.data().chunkCount || 0) : 0;
  const batch = db.batch();
  chunks.forEach((chunk, idx)=>{
    batch.set(db.collection(collectionName).doc('chunk_'+idx), { rows: chunk });
  });
  for(let i=chunks.length; i<oldCount; i++){
    batch.delete(db.collection(collectionName).doc('chunk_'+i));
  }
  const updatedAt = new Date().toISOString();
  batch.set(metaRef, { chunkCount: chunks.length, updatedAt });
  await batch.commit();
  return updatedAt;
}
async function loadFromFirestore(collectionName, metaKey){
  const metaSnap = await db.collection('meta').doc(metaKey).get();
  if(!metaSnap.exists) return { rows: [], updatedAt: '' };
  const { chunkCount, updatedAt } = metaSnap.data();
  const snaps = await Promise.all(
    Array.from({length: chunkCount}, (_,i)=> db.collection(collectionName).doc('chunk_'+i).get())
  );
  const rows = [];
  snaps.forEach(s=>{ if(s.exists) rows.push(...s.data().rows); });
  return { rows, updatedAt };
}
function fmtDate(iso){ return iso ? new Date(iso).toLocaleString('id-ID') : ''; }

async function loadAll(){
  const [pl, sn, sc, bc] = await Promise.all([
    loadFromFirestore('priceList', 'priceList'),
    loadFromFirestore('serialNumber', 'serialNumber'),
    loadFromFirestore('stockCabang', 'stockCabang'),
    loadFromFirestore('barcode', 'barcode')
  ]);
  state.items = pl.rows; state.itemsUpdated = fmtDate(pl.updatedAt);
  state.serialNumber = sn.rows; state.serialUpdated = fmtDate(sn.updatedAt);
  state.stockCabang = sc.rows; state.cabangUpdated = fmtDate(sc.updatedAt);
  state.barcode = bc.rows; state.barcodeUpdated = fmtDate(bc.updatedAt);
  buildIndices();
  state.loaded = true;
  render();
}

function buildIndices(){
  state.items.forEach(it=>{ it._noL = it.itemNo.toLowerCase(); it._dsL = it.deskripsi.toLowerCase(); });
  state.serialNumber.forEach(sn=>{ sn._codeL = sn.itemCode.toLowerCase(); sn._dsL = sn.deskripsi.toLowerCase(); });
  state.stockCabang.forEach(sc=>{ sc._noL = sc.itemNo.toLowerCase(); sc._dsL = sc.deskripsi.toLowerCase(); });
  state.barcode.forEach(bc=>{ bc._noL = bc.itemNo.toLowerCase(); bc._dsL = bc.deskripsi.toLowerCase(); bc._bcL = bc.barcode.toLowerCase(); });
  const idx1 = {}; state.items.forEach(it=>{ (idx1[it.itemNo] = idx1[it.itemNo] || []).push(it); });
  const idx2 = {}; state.serialNumber.forEach(sn=>{ (idx2[sn.itemCode] = idx2[sn.itemCode] || []).push(sn); });
  const idx3 = {}; state.stockCabang.forEach(sc=>{ (idx3[sc.itemNo] = idx3[sc.itemNo] || []).push(sc); });
  const idx4 = {}; state.barcode.forEach(bc=>{ (idx4[bc.itemNo] = idx4[bc.itemNo] || []).push(bc); });
  state.itemsIndex = idx1; state.serialIndex = idx2; state.cabangIndex = idx3; state.barcodeIndex = idx4;
}

// ---------------- Auth ----------------
auth.onAuthStateChanged(user=>{
  state.staffMode = !!user;
  if(state.loaded) render();
});

// ---------------- UI ----------------
function render(){
  const staffBtn = document.getElementById('staffBtn');
  staffBtn.textContent = state.staffMode ? 'Keluar Mode Staff' : 'Masuk Mode Staff';
  staffBtn.className = state.staffMode ? 'small ghost' : 'small';
  staffBtn.onclick = () => {
    if(state.staffMode){ auth.signOut(); }
    else { state.showLogin = true; state.loginErr=''; render(); }
  };

  const app = document.getElementById('app');
  if(!state.staffMode){
    app.innerHTML = stokView();
    bindStok();
  } else {
    app.innerHTML = `
      <div class="tabs">${tabBtn('stok','Cek Stok')}${tabBtn('upload','Upload Excel')}</div>
      <div id="tabBody"></div>`;
    document.getElementById('tabBody').innerHTML = state.tab === 'stok' ? stokView() : uploadView();
    document.querySelectorAll('.tabs > .tab').forEach(el=>el.onclick=()=>{ state.tab = el.dataset.tab; render(); });
    if(state.tab==='stok') bindStok(); if(state.tab==='upload') bindUpload();
  }
  renderLoginOverlay();
}
function tabBtn(id,label){ return `<div class="tab ${state.tab===id?'active':''}" data-tab="${id}">${label}</div>`; }

function renderLoginOverlay(){
  let existing = document.getElementById('loginOverlay');
  if(existing) existing.remove();
  if(!state.showLogin) return;
  const div = document.createElement('div');
  div.className = 'overlay'; div.id = 'loginOverlay';
  div.innerHTML = `<div class="modal">
      <h2>Masuk Mode Staff Gudang</h2>
      <input type="password" id="pinInput" inputmode="numeric" placeholder="Masukkan PIN staff">
      <div class="err">${state.loginErr}</div>
      <div style="display:flex;gap:8px;">
        <button id="loginSubmit">Masuk</button>
        <button class="ghost" id="loginCancel">Batal</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById('pinInput').focus();
  const submit = async ()=>{
    const pin = document.getElementById('pinInput').value.trim();
    if(pin !== STAFF_ACCOUNT.pin){ state.loginErr = 'PIN salah.'; renderLoginOverlay(); return; }
    try{
      await auth.signInWithEmailAndPassword(STAFF_ACCOUNT.email, STAFF_ACCOUNT.password);
      state.showLogin = false; state.tab = 'upload'; render();
    }catch(err){ state.loginErr = 'Gagal masuk, cek konfigurasi akun staff.'; renderLoginOverlay(); }
  };
  document.getElementById('loginSubmit').onclick = submit;
  document.getElementById('pinInput').onkeydown = (e)=>{ if(e.key==='Enter') submit(); };
  document.getElementById('loginCancel').onclick = ()=>{ state.showLogin=false; render(); };
}

function getCategories(){
  const set = new Set();
  [state.itemsIndex, state.serialIndex, state.cabangIndex, state.barcodeIndex].forEach(idx=>{
    Object.keys(idx).forEach(k=>{ const p=k.split('.')[0]; if(p) set.add(p); });
  });
  return Array.from(set).sort();
}
function catChipsHtml(){
  const cats = getCategories();
  if(!cats.length) return '';
  const chip = (id,label) => `<div class="tab ${state.categoryFilter===id?'active':''}" data-cat="${id===null?'':id}">${label}</div>`;
  return `<div class="tabs catRow">${chip(null,'Semua')}${cats.map(c=>chip(c,c)).join('')}</div>`;
}

function stokView(){
  return `<div class="card">
    <h2>Cek Harga & Stok</h2>
    <div class="hint">
      ${state.itemsUpdated ? 'Price list: '+state.itemsUpdated : 'Price list belum ada.'}
      ${state.serialUpdated ? ' &middot; Serial: '+state.serialUpdated : ''}
      ${state.cabangUpdated ? ' &middot; Cabang lain: '+state.cabangUpdated : ''}
      ${state.barcodeUpdated ? ' &middot; Barcode: '+state.barcodeUpdated : ''}
    </div>
    <input type="text" id="searchBox" value="${state.query.replace(/"/g,'&quot;')}" placeholder="Ketik Item No. atau Item Description...">
    ${catChipsHtml()}
    <div id="resultBody">${(state.items.length||state.serialNumber.length||state.stockCabang.length) ? '<div class="muted">Ketik untuk mulai mencari, atau pilih kategori.</div>' : '<div class="muted">Belum ada data.</div>'}</div>
  </div>`;
}

function parseTgl(str){
  if(!str) return null;
  const parts = String(str).split(/[\/\-]/);
  if(parts.length !== 3) return null;
  let [d,m,y] = parts.map(x=>parseInt(x,10));
  if(y < 100) y += 2000;
  const dt = new Date(y, m-1, d);
  return isNaN(dt.getTime()) ? null : dt;
}
function buildResults(q, category){
  q = q.toLowerCase();
  let keySet;
  if(q){
    keySet = new Set();
    state.items.forEach(it=>{ if(it._noL.includes(q)||it._dsL.includes(q)) keySet.add(it.itemNo); });
    state.serialNumber.forEach(sn=>{ if(sn._codeL.includes(q)||sn._dsL.includes(q)) keySet.add(sn.itemCode); });
    state.stockCabang.forEach(sc=>{ if(sc._noL.includes(q)||sc._dsL.includes(q)) keySet.add(sc.itemNo); });
    state.barcode.forEach(bc=>{ if(bc._noL.includes(q)||bc._dsL.includes(q)||bc._bcL.includes(q)) keySet.add(bc.itemNo); });
  } else {
    keySet = new Set([...Object.keys(state.itemsIndex), ...Object.keys(state.serialIndex), ...Object.keys(state.cabangIndex), ...Object.keys(state.barcodeIndex)]);
  }
  let keys = Array.from(keySet);
  if(category){ keys = keys.filter(k => k.split('.')[0] === category); }
  return keys.map(itemNo=>{
    const plRows = state.itemsIndex[itemNo] || [];
    const snRows = state.serialIndex[itemNo] || [];
    const scRows = state.cabangIndex[itemNo] || [];
    const bcRows = state.barcodeIndex[itemNo] || [];
    const deskripsi = (plRows[0]&&plRows[0].deskripsi) || (snRows[0]&&snRows[0].deskripsi) || (scRows[0]&&scRows[0].deskripsi) || (bcRows[0]&&bcRows[0].deskripsi) || '';
    const barcode = bcRows[0] ? bcRows[0].barcode : '';
    const ownByGudang = {}; const otherGudang = new Set();
    snRows.forEach(sn=>{
      if(OWN_WAREHOUSES.includes(sn.gudang)) (ownByGudang[sn.gudang]=ownByGudang[sn.gudang]||[]).push(sn);
      else if(sn.gudang) otherGudang.add(sn.gudang);
    });
    scRows.forEach(sc=>{ if(sc.gudang) otherGudang.add(sc.gudang); });
    return {itemNo, deskripsi, barcode, plRows, ownByGudang, otherGudang};
  });
}
function itemCardHtml(rec){
  const plTable = rec.plRows.length ? `
    <div class="tablewrap"><table>
      <thead><tr><th>Warehouse Code</th><th>Available</th><th>Allocated</th><th>Harga</th></tr></thead>
      <tbody>${rec.plRows.map(it=>`<tr><td>${it.gudang}</td><td>${it.available}</td><td>${it.allocated}</td>
        <td>Rp${Number(it.harga||0).toLocaleString('id-ID')}</td></tr>`).join('')}</tbody>
    </table></div>` : '<div class="muted">Tidak ada di price list gudang sendiri.</div>';
  const ownSerialBlocks = Object.keys(rec.ownByGudang).map(gudang=>{
    const list = rec.ownByGudang[gudang].slice().sort((a,b)=>{
      const da=parseTgl(a.tanggal), db_=parseTgl(b.tanggal); return (da&&db_) ? da-db_ : 0;
    });
    const oldest = list.reduce((min,x)=>{ const d=parseTgl(x.tanggal); return d&&(!min||d<min)?d:min; }, null);
    const chips = list.map(sn=>{
      const d = parseTgl(sn.tanggal);
      const isOld = oldest && d && d.getTime()===oldest.getTime();
      return `<span class="snChip ${isOld?'old':''}">${sn.serial} &middot; ${sn.tanggal||'-'}${isOld?' (FIFO)':''}</span>`;
    }).join('');
    return `<div class="snGroupLabel">Serial Number &mdash; ${gudang}</div><div class="snList">${chips}</div>`;
  }).join('');
  const indent = rec.otherGudang.size ? `<div class="indentBox">Status: Indent &mdash; tersedia di gudang: ${Array.from(rec.otherGudang).join(', ')}</div>` : '';
  return `<div class="itemCard"><h3>${rec.deskripsi} <span class="itemNo">(${rec.itemNo})</span></h3>${rec.barcode ? `<div class="muted" style="margin:-4px 0 10px;">Barcode: ${rec.barcode}</div>` : ''}${plTable}${ownSerialBlocks}${indent}</div>`;
}

const RESULT_CAP = 40;
let searchTimer = null;
function runSearchAndRenderBody(){
  const body = document.getElementById('resultBody');
  if(!body) return;
  const q = state.query.trim();
  if(!q && !state.categoryFilter){
    body.innerHTML = (state.items.length||state.serialNumber.length||state.stockCabang.length) ?
      '<div class="muted">Ketik untuk mulai mencari, atau pilih kategori.</div>' : '<div class="muted">Belum ada data.</div>';
    return;
  }
  const results = buildResults(q, state.categoryFilter);
  if(!results.length){ body.innerHTML = '<div class="muted">Tidak ditemukan.</div>'; return; }
  const shown = results.slice(0, RESULT_CAP);
  let html = shown.map(itemCardHtml).join('');
  if(results.length > RESULT_CAP) html += `<div class="muted">Menampilkan ${RESULT_CAP} dari ${results.length} hasil.</div>`;
  body.innerHTML = html;
}
function bindStok(){
  const box = document.getElementById('searchBox');
  box.oninput = ()=>{ state.query = box.value; clearTimeout(searchTimer); searchTimer = setTimeout(runSearchAndRenderBody, 200); };
  document.querySelectorAll('.catRow .tab').forEach(chip=>{
    chip.onclick = ()=>{
      const cat = chip.dataset.cat || null;
      state.categoryFilter = (cat===null) ? null : (state.categoryFilter===cat ? null : cat);
      render();
    };
  });
  runSearchAndRenderBody();
}

function uploadView(){
  return `<div class="card">
    <div class="uploadBlock">
      <h3>1. Price List</h3>
      <div class="hint">Kolom: <b>Item No., Item Description, Warehouse Code, Available, Allocated, List Price</b>.</div>
      <input type="file" id="fileInputPrice" accept=".xlsx,.xls,.csv">
      <div id="msgPrice" class="muted">${state.itemsUpdated ? 'Terakhir: '+state.itemsUpdated+' ('+state.items.length+' baris)' : ''}</div>
    </div>
    <div class="uploadBlock">
      <h3>2. Serial Number</h3>
      <div class="hint">Kolom: <b>Item Code, Item Description, Serial Number, Admission Date, Warehouse Code, Status</b>.</div>
      <input type="file" id="fileInputSerial" accept=".xlsx,.xls,.csv">
      <div id="msgSerial" class="muted">${state.serialUpdated ? 'Terakhir: '+state.serialUpdated+' ('+state.serialNumber.length+' baris)' : ''}</div>
    </div>
    <div class="uploadBlock">
      <h3>3. Stock Available (Cabang Lain)</h3>
      <div class="hint">Kolom: <b>Warehouse Code, Item No., Item Description, Available</b>. Gudang sendiri (SDNC.*) otomatis diabaikan.</div>
      <input type="file" id="fileInputCabang" accept=".xlsx,.xls,.csv">
      <div id="msgCabang" class="muted">${state.cabangUpdated ? 'Terakhir: '+state.cabangUpdated+' ('+state.stockCabang.length+' baris gudang lain)' : ''}</div>
    </div>
    <div class="uploadBlock">
      <h3>4. Barcode</h3>
      <div class="hint">Kolom: <b>Item No., Item Description, Bar Code</b>. Item tanpa barcode otomatis dilewati.</div>
      <input type="file" id="fileInputBarcode" accept=".xlsx,.xls,.csv">
      <div id="msgBarcode" class="muted">${state.barcodeUpdated ? 'Terakhir: '+state.barcodeUpdated+' ('+state.barcode.length+' baris)' : ''}</div>
    </div>
  </div>`;
}
// Baca & parsing Excel dilakukan di Web Worker terpisah supaya halaman tidak "macet"
// saat memproses file besar (puluhan ribu baris). Interface readExcel() tetap sama persis.
const _xlsxWorkerCode = `
  importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  onmessage = function(e){
    try{
      const wb = XLSX.read(e.data, {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {raw:true, defval:''});
      postMessage({ok:true, rows});
    }catch(err){ postMessage({ok:false}); }
  };
`;
const _xlsxWorkerUrl = URL.createObjectURL(new Blob([_xlsxWorkerCode], {type:'application/javascript'}));

function readExcel(file, onRows){
  const worker = new Worker(_xlsxWorkerUrl);
  const reader = new FileReader();
  reader.onload = (ev)=>{ worker.postMessage(ev.target.result, [ev.target.result]); };
  reader.onerror = ()=>{ onRows(null); worker.terminate(); };
  worker.onmessage = (e)=>{ onRows(e.data.ok ? e.data.rows : null); worker.terminate(); };
  worker.onerror = ()=>{ onRows(null); worker.terminate(); };
  reader.readAsArrayBuffer(file);
}
function pick(r, ...keys){
  const norm = s => String(s).trim().toLowerCase().replace(/\s+/g,' ');
  const wanted = keys.map(norm);
  for(const rawKey of Object.keys(r)){ if(wanted.includes(norm(rawKey))) return r[rawKey]; }
  return '';
}
function toNumber(v){
  if(typeof v === 'number') return v;
  if(!v) return 0;
  const n = parseFloat(String(v).replace(/[^0-9.-]/g,''));
  return isNaN(n) ? 0 : n;
}
function bindUpload(){
  document.getElementById('fileInputPrice').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const msg = document.getElementById('msgPrice'); msg.textContent = 'Membaca file...';
    readExcel(file, async (rows)=>{
      if(!rows){ msg.textContent = 'Gagal membaca file.'; return; }
      const parsed = rows.map(r=>({
        itemNo: String(pick(r,'Item No.','Item No')||'').trim(),
        deskripsi: String(pick(r,'Item Description')||'').trim(),
        gudang: pick(r,'Warehouse Code') || '',
        available: toNumber(pick(r,'Available')),
        allocated: toNumber(pick(r,'Allocated')),
        harga: toNumber(pick(r,'List Price'))
      })).filter(r=>r.itemNo || r.deskripsi);
      msg.textContent = `Mengunggah ${parsed.length} baris ke database bersama...`;
      const updatedAt = await pushToFirestore('priceList', parsed, 'priceList');
      state.items = parsed; state.itemsUpdated = fmtDate(updatedAt);
      buildIndices();
      msg.textContent = `Terakhir: ${state.itemsUpdated} (${state.items.length} baris)`;
    });
  };
  document.getElementById('fileInputSerial').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const msg = document.getElementById('msgSerial'); msg.textContent = 'Membaca file...';
    readExcel(file, async (rows)=>{
      if(!rows){ msg.textContent = 'Gagal membaca file.'; return; }
      const parsed = rows.map(r=>({
        itemCode: String(pick(r,'Item Code')||'').trim(),
        deskripsi: String(pick(r,'Item Description')||'').trim(),
        serial: String(pick(r,'Serial Number')||'').trim(),
        tanggal: String(pick(r,'Admission Date')||'').trim(),
        gudang: String(pick(r,'Warehouse Code')||'').trim(),
        status: String(pick(r,'Status')||'').trim()
      })).filter(r=>r.itemCode);
      msg.textContent = `Mengunggah ${parsed.length} baris ke database bersama... (bisa beberapa puluh detik)`;
      const updatedAt = await pushToFirestore('serialNumber', parsed, 'serialNumber');
      state.serialNumber = parsed; state.serialUpdated = fmtDate(updatedAt);
      buildIndices();
      msg.textContent = `Terakhir: ${state.serialUpdated} (${state.serialNumber.length} baris)`;
    });
  };
  document.getElementById('fileInputCabang').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const msg = document.getElementById('msgCabang'); msg.textContent = 'Membaca file...';
    readExcel(file, async (rows)=>{
      if(!rows){ msg.textContent = 'Gagal membaca file.'; return; }
      const parsed = rows.map(r=>({
        itemNo: String(pick(r,'Item No.','Item No')||'').trim(),
        deskripsi: String(pick(r,'Item Description')||'').trim(),
        gudang: String(pick(r,'Warehouse Code')||'').trim()
      })).filter(r=>r.itemNo && !OWN_WAREHOUSES.includes(r.gudang));
      msg.textContent = `Mengunggah ${parsed.length} baris ke database bersama... (bisa beberapa puluh detik)`;
      const updatedAt = await pushToFirestore('stockCabang', parsed, 'stockCabang');
      state.stockCabang = parsed; state.cabangUpdated = fmtDate(updatedAt);
      buildIndices();
      msg.textContent = `Terakhir: ${state.cabangUpdated} (${state.stockCabang.length} baris gudang lain)`;
    });
  };
  document.getElementById('fileInputBarcode').onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const msg = document.getElementById('msgBarcode'); msg.textContent = 'Membaca file...';
    readExcel(file, async (rows)=>{
      if(!rows){ msg.textContent = 'Gagal membaca file.'; return; }
      const parsed = rows.map(r=>({
        itemNo: String(pick(r,'Item No.','Item No')||'').trim(),
        deskripsi: String(pick(r,'Item Description')||'').trim(),
        barcode: String(pick(r,'Bar Code','Barcode')||'').trim()
      })).filter(r=>r.itemNo && r.barcode);
      msg.textContent = `Mengunggah ${parsed.length} baris ke database bersama...`;
      const updatedAt = await pushToFirestore('barcode', parsed, 'barcode');
      state.barcode = parsed; state.barcodeUpdated = fmtDate(updatedAt);
      buildIndices();
      msg.textContent = `Terakhir: ${state.barcodeUpdated} (${state.barcode.length} baris)`;
    });
  };
}

loadAll();
</script>
